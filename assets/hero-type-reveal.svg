<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56,189,248,0.6)"/>
      <stop offset="100%" stop-color="rgba(168,85,247,0.6)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="drumClip">
      <rect x="0" y="0" width="130" height="42" rx="6"/>
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&amp;display=swap');

    .mono { font-family: 'JetBrains Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    /* Typewriter Loop (6s total cycle) */
    .char {
      opacity: 0;
      animation: typeIn 6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    @keyframes typeIn {
      0%, 5% { opacity: 0; transform: translateY(4px); }
      12%, 85% { opacity: 1; transform: translateY(0); }
      92%, 100% { opacity: 0; transform: translateY(4px); }
    }

    /* Stagger character animation delays */
    .c0 { animation-delay: 0.10s; }
    .c1 { animation-delay: 0.14s; }
    .c2 { animation-delay: 0.18s; }
    .c3 { animation-delay: 0.22s; }
    .c4 { animation-delay: 0.26s; }
    .c5 { animation-delay: 0.30s; }
    .c6 { animation-delay: 0.34s; }
    .c7 { animation-delay: 0.38s; }
    .c8 { animation-delay: 0.42s; }
    .c9 { animation-delay: 0.46s; }
    .c10 { animation-delay: 0.50s; }
    .c11 { animation-delay: 0.54s; }
    .c12 { animation-delay: 0.58s; }
    .c13 { animation-delay: 0.62s; }
    .c14 { animation-delay: 0.66s; }
    .c15 { animation-delay: 0.70s; }
    .c16 { animation-delay: 0.74s; }
    .c17 { animation-delay: 0.78s; }
    .c18 { animation-delay: 0.82s; }
    .c19 { animation-delay: 0.86s; }
    .c20 { animation-delay: 0.90s; }
    .c21 { animation-delay: 0.94s; }
    .c22 { animation-delay: 0.98s; }
    .c23 { animation-delay: 1.02s; }
    .c24 { animation-delay: 1.06s; }
    .c25 { animation-delay: 1.10s; }
    .c26 { animation-delay: 1.14s; }
    .c27 { animation-delay: 1.18s; }
    .c28 { animation-delay: 1.22s; }
    .c29 { animation-delay: 1.26s; }
    .c30 { animation-delay: 1.30s; }
    .c31 { animation-delay: 1.34s; }
    .c32 { animation-delay: 1.38s; }
    .c33 { animation-delay: 1.42s; }

    /* Blinking Cursor */
    .cursor {
      animation: blink 0.8s infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Reveal Badge */
    .reveal-badge {
      opacity: 0;
      transform: translateY(16px);
      animation: revealIn 6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      animation-delay: 1.6s;
    }
    @keyframes revealIn {
      0%, 5% { opacity: 0; transform: translateY(16px); }
      15%, 85% { opacity: 1; transform: translateY(0); }
      92%, 100% { opacity: 0; transform: translateY(16px); }
    }

    /* Drum Roll Animation */
    .drum-ribbon {
      transform: translateY(0);
      animation: drumRoll 6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      animation-delay: 1.8s;
    }
    @keyframes drumRoll {
      0%, 5% { transform: translateY(0); }
      30%, 85% { transform: translateY(-336px); }
      92%, 100% { transform: translateY(0); }
    }

    /* Counter Animation */
    .counter-val {
      opacity: 0;
      animation: countUp 6s ease-out infinite;
      animation-delay: 1.7s;
    }
    @keyframes countUp {
      0%, 5% { opacity: 0; }
      15%, 85% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }
  </style>

  <!-- Background Window Card -->
  <rect width="900" height="480" rx="20" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" filter="url(#boxShadow)"/>

  <!-- Window Header with Traffic Lights -->
  <rect x="0" y="0" width="900" height="48" rx="20" fill="rgba(255,255,255,0.03)"/>
  <line x1="0" y1="48" x2="900" y2="48" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="6" fill="#10b981"/>
  <text x="450" y="30" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle" class="mono">@datex2/dx-type — Unified Orchestrator Demo</text>

  <!-- Tag Pill -->
  <g transform="translate(365, 80)">
    <rect width="170" height="26" rx="13" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="85" y="17" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" class="mono">&lt;dx-type-ready&gt;</text>
  </g>

  <!-- 1. Typewriter Hero Line -->
  <g transform="translate(450, 160)" text-anchor="middle">
    <!-- "Build incredible web animations" -->
    <text y="0" font-size="34" font-weight="800" fill="#f8fafc" class="sans">
      <tspan class="char c0">B</tspan><tspan class="char c1">u</tspan><tspan class="char c2">i</tspan><tspan class="char c3">l</tspan><tspan class="char c4">d</tspan>
      <tspan class="char c5">&#160;</tspan>
      <tspan class="char c6">i</tspan><tspan class="char c7">n</tspan><tspan class="char c8">c</tspan><tspan class="char c9">r</tspan><tspan class="char c10">e</tspan><tspan class="char c11">d</tspan><tspan class="char c12">i</tspan><tspan class="char c13">b</tspan><tspan class="char c14">l</tspan><tspan class="char c15">e</tspan>
      <tspan class="char c16">&#160;</tspan>
      <tspan class="char c17">w</tspan><tspan class="char c18">e</tspan><tspan class="char c19">b</tspan>
      <tspan class="char c20">&#160;</tspan>
      <tspan class="char c21">a</tspan><tspan class="char c22">n</tspan><tspan class="char c23">i</tspan><tspan class="char c24">m</tspan><tspan class="char c25">a</tspan><tspan class="char c26">t</tspan><tspan class="char c27">i</tspan><tspan class="char c28">o</tspan><tspan class="char c29">n</tspan><tspan class="char c30">s</tspan>
    </text>
  </g>

  <!-- 2. Reveal Tag: ✨ with DATEx2 -->
  <g class="reveal-badge" transform="translate(450, 220)">
    <g transform="translate(-110, -20)">
      <rect width="220" height="40" rx="20" fill="rgba(56, 189, 248, 0.12)" stroke="url(#badgeBorder)" stroke-width="1.5"/>
      <text x="110" y="25" fill="#38bdf8" font-size="16" font-weight="700" text-anchor="middle" class="sans" filter="url(#glow)">✨ with DATEx2</text>
    </g>
  </g>

  <!-- 3. Component Showcase Cards Grid (Bottom Row) -->
  <!-- Card 1: <dx-number> -->
  <g transform="translate(60, 290)">
    <rect width="230" height="135" rx="14" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="115" y="32" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" class="mono">&lt;dx-number&gt;</text>
    <text x="115" y="80" fill="#ffffff" font-size="26" font-weight="800" text-anchor="middle" class="mono counter-val">2 450 €</text>
    <text x="115" y="112" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle" class="sans">Single rAF 60/120fps</text>
  </g>

  <!-- Card 2: <dx-odometer> (3D Rolling Mechanical Drum) -->
  <g transform="translate(335, 290)">
    <rect width="230" height="135" rx="14" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="115" y="32" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" class="mono">&lt;dx-odometer&gt;</text>
    
    <!-- Drum Aperture -->
    <g transform="translate(50, 52)" clip-path="url(#drumClip)">
      <rect width="130" height="42" rx="6" fill="#030712" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <g class="drum-ribbon" fill="#34d399" font-size="26" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono', monospace">
        <text x="65" y="32">2018</text>
        <text x="65" y="74">2019</text>
        <text x="65" y="116">2020</text>
        <text x="65" y="158">2021</text>
        <text x="65" y="200">2022</text>
        <text x="65" y="242">2023</text>
        <text x="65" y="284">2024</text>
        <text x="65" y="326">2025</text>
        <text x="65" y="368">2026</text>
      </g>
    </g>
    
    <text x="115" y="118" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle" class="sans">Pure CSS 3D Drum Roll</text>
  </g>

  <!-- Card 3: Composite (.tw-embed) -->
  <g transform="translate(610, 290)">
    <rect width="230" height="135" rx="14" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="115" y="32" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" class="mono">Composite (.tw-embed)</text>
    <text x="115" y="78" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle" class="sans">
      Since <tspan fill="#34d399" font-family="'JetBrains Mono', monospace">2026</tspan>
    </text>
    <text x="115" y="112" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle" class="sans">Typewriter + Embedded Roll</text>
  </g>
</svg>
